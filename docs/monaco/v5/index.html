<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definitions Explorer V5</title>
  <link rel="stylesheet" href="./workspace/css/workspace.css">
  <link rel="stylesheet" href="./components/left/css/left.css">
  <link rel="stylesheet" href="./components/right/css/right.css">
</head>

<body>
  <main class="workspace" id="leftWorkspace">
    <!-- Left Panel: Minimalist Selectors -->
    <aside class="left-workspace" aria-label="Definition Selectors">
      <div class="control-group">
        <label for="rootSelect">Control type</label>
        <select id="rootSelect" aria-label="Control type">
          <option value="">Select Control</option>
        </select>
      </div>

      <div class="control-group" id="variantStep">
        <label for="variantSelect">Variation</label>
        <select id="variantSelect" aria-label="Variation" disabled>
          <option value="">Select Variation</option>
        </select>
      </div>

      <div class="control-group" id="contractStep">
        <label for="contractSelect">Contract part</label>
        <select id="contractSelect" aria-label="Contract part" disabled>
          <option value="">Select Part</option>
        </select>
      </div>

      <button id="showAll" class="show-all-btn" type="button">Show all</button>
    </aside>

    <!-- Right Panel: Clean Monaco Editor -->
    <section class="right-workspace" aria-label="Monaco Editor">
      <div class="editor-header">
        <span id="editorTitle">definitions.json</span>
        <span id="editorPath">Complete library</span>
      </div>
      <div id="monacoEditor" class="monaco-editor"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/declarative-definitions/dist/v2/min.js"></script>

  <script type="module" src="./index.js"></script>
</body>

</html>
